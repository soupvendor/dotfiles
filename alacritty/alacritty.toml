# -----------------------------------------------------------------------------
# Colors are NOT in this file. They live in colors-day.toml / colors-night.toml,
# and theme-sync copies whichever is current over ~/.config/alacritty/colors.toml.
#
# This split is forced by alacritty's own precedence rule, which is the opposite
# of what you'd guess: imports load first and the IMPORTING file loads last, so
# any [colors] block written here would silently beat the imported one and the
# terminal would never change. Keeping this file colorless is what makes the
# import authoritative.
#
# The same rule governs two settings that are not colors but belong to the
# palette anyway — `window.opacity` and `window.decorations_theme_variant`.
# Both are set per variant, so both are deliberately absent below. Writing
# either one here would pin it across the day/night switch.
#
# colors.toml is generated, so it is not a [dotfiles] symlink — theme-sync
# writes it in place, and alacritty's watcher picks up the write and repaints
# every open window. live_config_reload defaults to true; do not turn it off.
# -----------------------------------------------------------------------------
[general]
import = ["~/.config/alacritty/colors.toml"]

[env]
TERM = "xterm-256color"

[window]
# Cells, not pixels: 128x40 at 12.5pt lands near 1300x850, a working window on
# the ultrawide that still fits the rotated panel. This sizes NEW windows only,
# and the value is read at startup — a running alacritty ignores a change here.
dimensions = { columns = 128, lines = 40 }
padding = { x = 12, y = 12 }
# A window is rarely an exact multiple of the cell size, and the remainder
# otherwise piles up on the right and bottom edges. Spread it instead, so the
# text block stays centred in its frame at any size.
dynamic_padding = true
# decorations = "Buttonless"  # macOS only; remove on Linux
# opacity and decorations_theme_variant live in the palette files — see header.
blur = true
startup_mode = "Windowed"

[scrolling]
history = 10000

[font]
normal = { family = "JetBrainsMono Nerd Font", style = "Regular" }
bold   = { family = "JetBrainsMono Nerd Font", style = "Bold" }
italic = { family = "JetBrainsMono Nerd Font", style = "Italic" }
size = 12.5

[cursor]
style = { shape = "Block", blinking = "On" }
blink_interval = 500

[keyboard]
bindings = [
  { key = "K", mods = "Command", action = "ClearHistory" },
]
