"$schema" = 'https://starship.rs/config-schema.json'

# Tokyo Night palette
palette = "tokyo_night"

format = """
[](fg:blue)\
$directory\
[](fg:blue bg:purple)\
$git_branch\
$git_status\
[](fg:purple bg:green)\
$python\
$nodejs\
$rust\
$golang\
[](fg:green)\
$fill\
$cmd_duration\
$time\
$line_break\
$character"""

[palettes.tokyo_night]
blue    = "#7aa2f7"
purple  = "#bb9af7"
green   = "#9ece6a"
yellow  = "#e0af68"
red     = "#f7768e"
bg      = "#1a1b26"
fg      = "#c0caf5"
surface = "#414868"

[directory]
style            = "bold fg:bg bg:blue"
format           = "[ $path ]($style)"
truncation_length = 3
truncate_to_repo = false

[git_branch]
style  = "bold fg:bg bg:purple"
format = "[ $symbol$branch ]($style)"
symbol = " "

[git_status]
style      = "fg:bg bg:purple"
format     = "[$all_status$ahead_behind]($style)"
ahead      = "⇡${count}"
behind     = "⇣${count}"
diverged   = "⇕⇡${ahead_count}⇣${behind_count}"
untracked  = "?"
modified   = "!"
staged     = "+"
deleted    = "-"
conflicted = "⚡"

[python]
style   = "bold fg:bg bg:green"
format  = "[ $symbol$version ]($style)"
symbol  = " "

[nodejs]
style   = "bold fg:bg bg:green"
format  = "[ $symbol$version ]($style)"
symbol  = " "

[rust]
style   = "bold fg:bg bg:green"
format  = "[ $symbol$version ]($style)"
symbol  = " "

[golang]
style   = "bold fg:bg bg:green"
format  = "[ $symbol$version ]($style)"
symbol  = " "

[fill]
symbol = " "

[cmd_duration]
style    = "fg:yellow"
format   = "[ $duration]($style)"
min_time = 2000

[time]
disabled     = false
style        = "fg:surface"
format       = "[$time]($style)"
time_format  = "%H:%M"

[character]
success_symbol = "[❯](bold fg:green)"
error_symbol   = "[❯](bold fg:red)"
