# =========================================
# Prefix
# =========================================
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# =========================================
# Core settings
# =========================================
set -g mouse on
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000
set -g escape-time 0       # no delay for escape key
set -g focus-events on

# True color support
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# =========================================
# Key bindings
# =========================================
# Split panes (preserve cwd)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# New window at cwd
bind c new-window -c "#{pane_current_path}"

# Vim-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize panes
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Reload config
bind r source-file ~/.tmux.conf \; display "Config reloaded"

# =========================================
# Copy mode (vi keys)
# =========================================
set-window-option -g mode-keys vi
bind -T copy-mode-vi v   send-keys -X begin-selection
bind -T copy-mode-vi y   send-keys -X copy-selection-and-cancel
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle

# Copy to system clipboard (macOS: pbcopy, Linux: xclip/wl-copy)
if-shell "uname | grep -q Darwin" {
  bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
} {
  bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -in -selection clipboard 2>/dev/null || wl-copy"
}

# =========================================
# Status bar (Tokyo Night colors)
# =========================================
set -g status-position top
set -g status-style          "bg=#1a1b26 fg=#a9b1d6"
set -g status-left-length    40
set -g status-right-length   60
set -g status-left           "#[fg=#1a1b26,bg=#7aa2f7,bold] #S #[fg=#7aa2f7,bg=#1a1b26]"
set -g status-right          "#[fg=#414868] %H:%M  %d %b "
set -g window-status-format         " #I:#W "
set -g window-status-current-format "#[fg=#1a1b26,bg=#bb9af7,bold] #I:#W #[fg=#bb9af7,bg=#1a1b26]"
set -g window-status-separator      ""
set -g pane-border-style            "fg=#414868"
set -g pane-active-border-style     "fg=#7aa2f7"
set -g message-style                "bg=#1a1b26 fg=#e0af68"

# =========================================
# Plugins (via TPM)
# Install: prefix + I    Update: prefix + U
# =========================================
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'   # persist sessions across restarts
set -g @plugin 'tmux-plugins/tmux-continuum'   # auto-save sessions

set -g @continuum-restore 'on'
set -g @resurrect-capture-pane-contents 'on'

# Keep at the very bottom
run '~/.tmux/plugins/tpm/tpm'
